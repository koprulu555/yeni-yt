name: Generate YouTube M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repository'yi indir
      uses: actions/checkout@v4

    - name: 🐍 Python'ı kur
      uses: actions/setup-python@vv5
      with:
        python-version: '3.10'

    - name: 📦 Gelişmiş yt-dlp'yi yükle
      uses: AnimMouse/setup-yt-dlp@v3
      with:
        ejs-node: true
        ffmpeg: true

    - name: 🚀 M3U dosyasını oluştur
      id: generate
      run: |
        python m3u_generator.py
        if [ -f "yt.m3u" ]; then
          echo "m3u_created=true" >> $GITHUB_OUTPUT
        else
          echo "m3u_created=false" >> $GITHUB_OUTPUT
        fi

    - name: 💾 Değişiklikleri GitHub'a kaydet
      if: steps.generate.outputs.m3u_created == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add yt.m3u
        if git diff --cached --quiet; then
          echo "M3U dosyasında değişiklik yok"
        else
          git commit -m "🤖 Otomatik güncelleme: yt.m3u playlist"
          git push
        fi
